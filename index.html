<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>RCCG Champions Cathedral — Media Team</title>
  <meta name="theme-color" content="#0A1628"/>
  <meta name="description" content="Media Team attendance, points, streaks and daily devotionals for RCCG Champions Cathedral, Warri."/>

  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png"/>
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="auth-page">
  <div class="auth-bg">
    <div class="auth-overlay"></div>
    <div class="cross-pattern"></div>
    <div class="auth-orb o1"></div>
    <div class="auth-orb o2"></div>
  </div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="RCCG Champions Cathedral crest"/>
        <h1 class="brand-name">Champions Cathedral</h1>
        <p class="brand-sub">Media Team Portal</p>
      </div>

      <div class="form-panel">
        <div id="loginForm">
          <h2 class="form-title">Welcome Back</h2>
          <p class="form-sub">Sign in to your team account</p>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-field">
              <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
              <button type="button" class="pw-toggle" data-target="loginPassword" aria-label="Show password"></button>
            </div>
          </div>
          <div class="field-row-end">
            <button type="button" class="link-muted" onclick="toggleForms('forgot')">Forgot password?</button>
          </div>
          <div id="loginError" class="error-msg hidden"></div>
          <button class="btn-primary" onclick="handleLogin()"><span>Sign In</span><span class="btn-icon">→</span></button>
          <p class="form-switch">New to the team? <a onclick="toggleForms('register')">Request Access</a></p>
        </div>

        <div id="registerForm" class="hidden">
          <h2 class="form-title">Join the Team</h2>
          <p class="form-sub">Create your media team account</p>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="e.g. Chukwuemeka Obi" autocomplete="name"/>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="regPhone" placeholder="+234 800 000 0000" autocomplete="tel"/>
          </div>
          <div class="form-group">
            <label>Role on Media Team</label>
            <select id="regRole">
              <option value="">Select your role</option>
              <option>Camera Operator</option>
              <option>Videography</option>
              <option>Sound Engineer</option>
              <option>Live Stream Operator</option>
              <option>Graphics & Display</option>
              <option>Photography</option>
              <option>Video Editor</option>
              <option>Reels</option>
              <option>Content Creator</option>
              <option>Content Curator</option>
              <option>Content Strategist</option>
              <option>Social Media</option>
              <option>Anchor</option>
              <option>Media Director</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="password-field">
              <input type="password" id="regPassword" placeholder="Min. 6 characters" autocomplete="new-password"/>
              <button type="button" class="pw-toggle" data-target="regPassword" aria-label="Show password"></button>
            </div>
          </div>
          <div id="registerError" class="error-msg hidden"></div>
          <div id="registerSuccess" class="success-msg hidden"></div>
          <button class="btn-primary" onclick="handleRegister()"><span>Create Account</span><span class="btn-icon">→</span></button>
          <p class="form-switch">Already have an account? <a onclick="toggleForms('login')">Sign In</a></p>
        </div>

        <div id="forgotForm" class="hidden">
          <h2 class="form-title">Reset Password</h2>
          <p class="form-sub">Enter your account email — we'll send a reset link</p>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div id="forgotError" class="error-msg hidden"></div>
          <div id="forgotSuccess" class="success-msg hidden"></div>
          <button class="btn-primary" id="forgotBtn" onclick="handleForgotPassword()"><span>Send Reset Link</span></button>
          <button class="btn-secondary" style="margin-top:10px;" onclick="toggleForms('login')"><span>Back to Sign In</span></button>
        </div>
      </div>
    </div>
    <p class="auth-footer">RCCG Champions Cathedral · Warri</p>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { icon } from "./js/icons.js";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          window.location.href = snap.data().role === "admin" ? "pages/admin.html" : "pages/member.html";
        }
      }
    });

    window.handleLogin = async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const errEl = document.getElementById("loginError");
      errEl.classList.add("hidden");
      try {
        const btn = document.querySelector("#loginForm .btn-primary");
        btn.innerHTML = '<span>Signing in...</span>'; btn.disabled = true;
        await signInWithEmailAndPassword(auth, email, password);
      } catch(e) {
        document.querySelector("#loginForm .btn-primary").innerHTML = '<span>Sign In</span><span class="btn-icon">→</span>';
        document.querySelector("#loginForm .btn-primary").disabled = false;
        errEl.textContent = "Invalid email or password. Try again.";
        errEl.classList.remove("hidden");
      }
    };

    window.handleRegister = async () => {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const mediaRole = document.getElementById("regRole").value;
      const password = document.getElementById("regPassword").value;
      const errEl = document.getElementById("registerError");
      const succEl = document.getElementById("registerSuccess");
      errEl.classList.add("hidden"); succEl.classList.add("hidden");
      if (!name || !email || !phone || !mediaRole || !password) { errEl.textContent = "Please fill in all fields."; errEl.classList.remove("hidden"); return; }
      if (password.length < 6) { errEl.textContent = "Password must be at least 6 characters."; errEl.classList.remove("hidden"); return; }
      try {
        const btn = document.querySelector("#registerForm .btn-primary");
        btn.innerHTML = '<span>Creating account...</span>'; btn.disabled = true;
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), {
          uid: cred.user.uid, name, email, phone, mediaRole,
          role: "member", points: 0, streak: 0, totalAttended: 0, totalMissed: 0,
          devotionalStreak: 0, devotionalLongestStreak: 0, totalDevotionals: 0, lastDevotionalDate: null,
          photoURL: null,
          joinedAt: new Date().toISOString(), status: "active"
        });
        succEl.textContent = "Account created! Signing you in...";
        succEl.classList.remove("hidden");
      } catch(e) {
        document.querySelector("#registerForm .btn-primary").innerHTML = '<span>Create Account</span><span class="btn-icon">→</span>';
        document.querySelector("#registerForm .btn-primary").disabled = false;
        errEl.textContent = e.message.includes("email-already-in-use") ? "This email is already registered." : "Something went wrong. Try again.";
        errEl.classList.remove("hidden");
      }
    };

    window.handleForgotPassword = async () => {
      const email = document.getElementById("forgotEmail").value.trim();
      const errEl = document.getElementById("forgotError");
      const succEl = document.getElementById("forgotSuccess");
      errEl.classList.add("hidden"); succEl.classList.add("hidden");
      if (!email) { errEl.textContent = "Enter your email address."; errEl.classList.remove("hidden"); return; }
      const btn = document.getElementById("forgotBtn");
      const original = btn.innerHTML;
      btn.innerHTML = "<span>Sending...</span>"; btn.disabled = true;
      try {
        await sendPasswordResetEmail(auth, email);
        succEl.textContent = "Reset link sent — check your inbox (and spam folder).";
        succEl.classList.remove("hidden");
      } catch (e) {
        // Don't reveal whether the email exists — generic, secure messaging.
        succEl.textContent = "If that email is registered, a reset link is on its way.";
        succEl.classList.remove("hidden");
      } finally {
        btn.innerHTML = original; btn.disabled = false;
      }
    };

    window.toggleForms = (form) => {
      document.getElementById("loginForm").classList.toggle("hidden", form !== "login");
      document.getElementById("registerForm").classList.toggle("hidden", form !== "register");
      document.getElementById("forgotForm").classList.toggle("hidden", form !== "forgot");
    };

    // password visibility toggles
    document.querySelectorAll(".pw-toggle").forEach((btn) => {
      btn.innerHTML = icon("eye");
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.innerHTML = icon(show ? "eyeOff" : "eye");
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });
  </script>
</body>
</html>
